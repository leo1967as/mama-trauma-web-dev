  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ily: 'Plus Jakarta Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"e32b7b3b-fc5a-4768-80a6-b724e9ead474\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Plus Jakarta Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"1d09df1c-8119-4973-93f3-d5724b16c75c\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Plus Jakarta Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"33da0495-9f12-4377-8aec-2a69a44ecf14\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n*, *::before, *::after {\n  box-sizing: border-box; margin: 0; padding: 0;\n  -webkit-tap-highlight-color: transparent;\n}\n\nbody {\n  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;\n  background: #2A1815;\n  min-height: 100vh;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n/* ── phone shell ── */\n.phone {\n  width: 360px;\n  height: 780px;\n  border-radius: 48px;\n  box-shadow:\n    0 0 0 9px #1A0E0C,\n    0 0 0 11px #2E1A17,\n    0 40px 100px rgba(0,0,0,.65),\n    0 10px 30px rgba(0,0,0,.35);\n  overflow: hidden;\n  position: relative;\n  background: #FAF0EC;\n}\n\n/* ── dynamic island ── */\n.island {\n  position: absolute;\n  top: 14px;\n  left: 50%;\n  transform: translateX(-50%);\n  width: 108px;\n  height: 30px;\n  background: #1A0E0C;\n  border-radius: 18px;\n  z-index: 20;\n}\n\n/* ══════════════════════════════\n   MESH GRADIENT BACKGROUND\n══════════════════════════════ */\n.bg {\n  position: absolute;\n  inset: 0;\n  background: #FAF0EC;\n  overflow: hidden;\n}\n\n/* Base warm tint */\n.bg-base {\n  position: absolute;\n  inset: 0;\n  background: radial-gradient(ellipse 100% 70% at 70% -10%, #F5C8A8 0%, transparent 65%),\n              radial-gradient(ellipse 80% 60% at -10% 20%, #F0C0B0 0%, transparent 60%),\n              #FAF0EC;\n}\n\n/* Animated blobs */\n.blob {\n  position: absolute;\n  border-radius: 50%;\n  filter: blur(48px);\n  mix-blend-mode: multiply;\n  opacity: 0;\n  will-change: transform, opacity;\n  animation: blob-in 1.8s ease forwards;\n}\n.blob-1 {\n  width: 320px; height: 320px;\n  background: radial-gradient(circle, #F0B8A8 0%, #ECA898 40%, transparent 70%);\n  top: -80px; left: -80px;\n  animation-delay: .2s;\n  animation: blob-in 2s ease forwards .2s, drift-1 18s ease-in-out 2.2s infinite;\n}\n.blob-2 {\n  width: 280px; height: 280px;\n  background: radial-gradient(circle, #F8D0C0 0%, #F0C0B0 40%, transparent 70%);\n  top: 60px; right: -60px;\n  animation: blob-in 2s ease forwards .5s, drift-2 22s ease-in-out 2.5s infinite;\n}\n.blob-3 {\n  width: 260px; height: 260px;\n  background: radial-gradient(circle, #EAB8B0 0%, #DFA8A0 40%, transparent 70%);\n  bottom: 200px; left: -40px;\n  animation: blob-in 2s ease forwards .8s, drift-3 20s ease-in-out 2.8s infinite;\n}\n.blob-4 {\n  width: 220px; height: 220px;\n  background: radial-gradient(circle, #F8E0D0 0%, #F0D0C0 40%, transparent 70%);\n  bottom: 100px; right: -40px;\n  animation: blob-in 2s ease forwards 1s, drift-4 24s ease-in-out 3s infinite;\n}\n\n@keyframes blob-in {\n  from { opacity: 0; transform: scale(.85); }\n  to   { opacity: .85; transform: scale(1); }\n}\n@keyframes drift-1 {\n  0%,100% { transform: translate(0,0) scale(1); }\n  33%  { transform: translate(30px, 40px) scale(1.05); }\n  66%  { transform: translate(-20px, 20px) scale(.96); }\n}\n@keyframes drift-2 {\n  0%,100% { transform: translate(0,0) scale(1); }\n  33%  { transform: translate(-25px, 35px) scale(1.04); }\n  66%  { transform: translate(15px, -20px) scale(.97); }\n}\n@keyframes drift-3 {\n  0%,100% { transform: translate(0,0) scale(1); }\n  40%  { transform: translate(20px, -30px) scale(1.06); }\n  70%  { transform: translate(-10px, 15px) scale(.95); }\n}\n@keyframes drift-4 {\n  0%,100% { transform: translate(0,0) scale(1); }\n  35%  { transform: translate(-20px, -25px) scale(1.03); }\n  65%  { transform: translate(18px, 20px) scale(.98); }\n}\n\n/* ── breathing ring ── */\n.breath-ring {\n  position: absolute;\n  top: 38%;\n  left: 50%;\n  transform: translate(-50%, -50%);\n  width: 260px;\n  height: 260px;\n  pointer-events: none;\n  z-index: 1;\n}\n.breath-ring circle {\n  fill: none;\n  stroke: rgba(200,112,106,.12);\n  stroke-width: 1;\n  transform-origin: 130px 130px;\n}\n.ring-1 { animation: ring-pulse 4s ease-in-out 1.5s infinite; }\n.ring-2 { animation: ring-pulse 4s ease-in-out 2.2s infinite; }\n.ring-3 { animation: ring-pulse 4s ease-in-out 2.9s infinite; }\n@keyframes ring-pulse {\n  0%   { transform: scale(.6); opacity: 0; }\n  20%  { opacity: 1; }\n  100% { transform: scale(1.6); opacity: 0; }\n}\n\n/* ══════════════════════════════\n   SCREEN CONTENT\n══════════════════════════════ */\n.screen {\n  position: relative;\n  z-index: 10;\n  height: 100%;\n  display: flex;\n  flex-direction: column;\n  padding: 0 28px 40px;\n}\n\n/* status bar space */\n.status {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  padding-top: 18px;\n  height: 52px;\n  flex-shrink: 0;\n}\n.status-time {\n  font-size: 14px;\n  font-weight: 600;\n  color: rgba(42,24,21,.8);\n}\n.status-icons { display: flex; gap: 5px; align-items: center; }\n\n/* ── wordmark ── */\n.wordmark {\n  margin-top: 8px;\n  font-size: 10px;\n  font-weight: 700;\n  letter-spacing: 2.5px;\n  text-transform: uppercase;\n  color: #C8706A;\n  opacity: 0;\n  transform: translateY(10px);\n  animation: rise .7s cubic-bezier(.22,1,.36,1) forwards;\n  animation-delay: .5s;\n}\n\n/* ── headline ── */\n.headline {\n  margin-top: 18px;\n  flex: 1;\n}\n.hl-small {\n  font-size: 28px;\n  font-weight: 700;\n  color: #2A1815;\n  line-height: 1.15;\n  display: block;\n  opacity: 0;\n  transform: translateY(18px);\n  animation: rise .75s cubic-bezier(.22,1,.36,1) forwards;\n  animation-delay: .75s;\n}\n.hl-serif {\n  display: block;\n  font-family: 'Playfair Display', serif;\n  font-size: 36px;\n  font-style: italic;\n  font-weight: 500;\n  color: #C8706A;\n  line-height: 1.15;\n  letter-spacing: -.3px;\n  opacity: 0;\n  transform: translateY(18px);\n  animation: rise .8s cubic-bezier(.22,1,.36,1) forwards;\n  animation-delay: .95s;\n}\n\n.subtitle {\n  margin-top: 14px;\n  font-size: 15px;\n  font-weight: 300;\n  color: #7A5A55;\n  line-height: 1.6;\n  max-width: 240px;\n  opacity: 0;\n  transform: translateY(14px);\n  animation: rise .75s cubic-bezier(.22,1,.36,1) forwards;\n  animation-delay: 1.2s;\n}\n\n/* ── floating dots ── */\n.float-dots {\n  display: flex;\n  gap: 7px;\n  margin-top: 32px;\n  opacity: 0;\n  animation: rise .6s ease forwards 1.55s;\n}\n.fdot {\n  width: 5px; height: 5px;\n  border-radius: 50%;\n  background: #EAD8D2;\n}\n.fdot:nth-child(1) { background: #C8706A; }\n.fdot:nth-child(2) { background: #D89088; }\n\n/* ── cta area ── */\n.cta-area {\n  flex-shrink: 0;\n  display: flex;\n  flex-direction: column;\n  gap: 0;\n  opacity: 0;\n  transform: translateY(20px);\n  animation: rise .8s cubic-bezier(.22,1,.36,1) forwards;\n  animation-delay: 1.45s;\n}\n\n/* ── THE BUTTON ── */\n.btn {\n  width: 100%;\n  border: none;\n  cursor: pointer;\n  border-radius: 18px;\n  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;\n  font-size: 15px;\n  font-weight: 600;\n  padding: 17px;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  position: relative;\n  overflow: hidden;\n  user-select: none;\n  -webkit-user-select: none;\n  letter-spacing: -.1px;\n  color: #fff;\n  background: linear-gradient(140deg, #A84848 0%, #C27068 45%, #CC8070 78%, #D49888 100%);\n  box-shadow:\n    0 14px 34px rgba(168,72,72,.36),\n    0 3px 8px rgba(168,72,72,.18),\n    inset 0 1px 0 rgba(255,255,255,.2),\n    inset 0 -1px 0 rgba(0,0,0,.1);\n  transition: transform .14s cubic-bezier(.34,1.3,.64,1), box-shadow .14s ease;\n  will-change: transform, box-shadow;\n}\n\n/* gloss */\n.btn::before {\n  content: '';\n  position: absolute;\n  inset: 0;\n  background: linear-gradient(180deg, rgba(255,255,255,.15) 0%, transparent 55%);\n  border-radius: 17px;\n  pointer-events: none;\n}\n\n/* shimmer */\n.btn::after {\n  content: '';\n  position: absolute;\n  top: 0; left: -100%; width: 52%; height: 100%;\n  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.22) 50%, transparent 100%);\n  transform: skewX(-18deg);\n  pointer-events: none;\n  animation: btn-shimmer 4s ease-in-out 2.5s infinite;\n}\n@keyframes btn-shimmer {\n  0%,100% { left: -100%; opacity: 1; }\n  40%      { left: 130%;  opacity: 1; }\n  41%      { opacity: 0; }\n}\n\n.btn-content {\n  position: relative;\n  z-index: 2;\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  transition: opacity .18s, transform .18s;\n}\n\n/* loading */\n.btn-loading {\n  position: absolute;\n  inset: 0; z-index: 2;\n  display: flex; align-items: center; justify-content: center; gap: 8px;\n  opacity: 0; pointer-events: none;\n  transition: opacity .18s;\n  font-size: 14px; font-weight: 500; color: rgba(255,255,255,.9);\n}\n.spinner {\n  width: 18px; height: 18px;\n  border: 2px solid rgba(255,255,255,.25);\n  border-top-color: rgba(255,255,255,.9);\n  border-radius: 50%;\n  animation: spin .65s linear infinite;\n}\n@keyframes spin { to { transform: rotate(360deg); } }\n\n/* done */\n.btn-done {\n  position: absolute;\n  inset: 0; z-index: 2;\n  display: flex; align-items: center; justify-content: center; gap: 7px;\n  opacity: 0; pointer-events: none;\n  transition: opacity .2s;\n  font-size: 14px; font-weight: 600; color: #fff;\n}\n.ck {\n  width: 18px; height: 18px; flex-shrink: 0;\n  fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round;\n  stroke-dasharray: 22; stroke-dashoffset: 22;\n}\n.ck.draw { animation: draw-ck .35s ease forwards; }\n@keyframes draw-ck { to { stroke-dashoffset: 0; } }\n\n/* states */\n.btn.pressing {\n  transform: scale(0.96) translateY(1.5px) !important;\n  box-shadow: 0 4px 12px rgba(168,72,72,.22), inset 0 1px 0 rgba(255,255,255,.18), inset 0 -1px 0 rgba(0,0,0,.1) !important;\n  transition: transform .06s ease, box-shadow .06s ease;\n}\n.btn.loading .btn-content  { opacity: 0; transform: scale(.88); }\n.btn.loading .btn-loading  { opacity: 1; }\n.btn.loading { cursor: default; pointer-events: none; }\n.btn.done-s .btn-loading   { opacity: 0; }\n.btn.done-s .btn-done      { opacity: 1; }\n.btn.done-s .btn-content   { opacity: 0; }\n\n/* ripple */\n.ripple {\n  position: absolute;\n  border-radius: 50%;\n  background: rgba(255,255,255,.28);\n  pointer-events: none;\n  transform: scale(0);\n  animation: rpl .6s ease-out forwards;\n  z-index: 3;\n}\n@keyframes rpl { to { transform: scale(5); opacity: 0; } }\n\n/* secondary link */\n.secondary {\n  text-align: center;\n  margin-top: 18px;\n  font-size: 13px;\n  font-weight: 400;\n  color: #A08580;\n  cursor: pointer;\n  padding: 4px;\n  transition: color .15s;\n}\n.secondary:hover { color: #C8706A; }\n\n/* ── page transition overlay ── */\n.overlay {\n  position: absolute;\n  inset: 0;\n  background: #FBF6F3;\n  z-index: 50;\n  border-radius: 48px;\n  opacity: 0;\n  pointer-events: none;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  gap: 12px;\n  transition: opacity .35s ease;\n}\n.overlay.show { opacity: 1; pointer-events: all; }\n.overlay-logo {\n  font-family: 'Playfair Display', serif;\n  font-style: italic;\n  font-size: 28px;\n  font-weight: 500;\n  color: #C8706A;\n  letter-spacing: -.3px;\n  opacity: 0;\n  transform: scale(.92);\n  transition: opacity .4s ease .15s, transform .5s cubic-bezier(.22,1,.36,1) .15s;\n}\n.overlay.show .overlay-logo { opacity: 1; transform: scale(1); }\n.overlay-sub {\n  font-size: 13px;\n  font-weight: 300;\n  color: #A08580;\n  opacity: 0;\n  transform: translateY(8px);\n  transition: opacity .4s ease .35s, transform .5s cubic-bezier(.22,1,.36,1) .35s;\n}\n.overlay.show .overlay-sub { opacity: 1; transform: translateY(0); }\n.overlay-dot {\n  width: 6px; height: 6px;\n  background: #EAD8D2;\n  border-radius: 50%;\n  margin-top: 8px;\n  opacity: 0;\n  transition: opacity .3s ease .5s;\n}\n.overlay.show .overlay-dot {\n  opacity: 1;\n  animation: pulse-dot 1.2s ease-in-out .6s infinite;\n}\n@keyframes pulse-dot {\n  0%,100% { transform: scale(1); background: #EAD8D2; }\n  50% { transform: scale(1.5); background: #C8706A; }\n}\n\n/* ── shared entrance ── */\n@keyframes rise {\n  from { opacity: 0; transform: translateY(18px); }\n  to   { opacity: 1; transform: translateY(0); }\n}\n<\u002Fstyle>\n\n\n<\u002Fhead>\n<body>\n\n<div class=\"phone\" id=\"phone\">\n  <div class=\"island\"><\u002Fdiv>\n\n  <!-- mesh gradient background -->\n  <div class=\"bg\">\n    <div class=\"bg-base\"><\u002Fdiv>\n    <div class=\"blob blob-1\"><\u002Fdiv>\n    <div class=\"blob blob-2\"><\u002Fdiv>\n    <div class=\"blob blob-3\"><\u002Fdiv>\n    <div class=\"blob blob-4\"><\u002Fdiv>\n\n    <!-- breathing rings -->\n    <svg class=\"breath-ring\" viewBox=\"0 0 260 260\">\n      <circle class=\"ring-1\" cx=\"130\" cy=\"130\" r=\"60\"><\u002Fcircle>\n      <circle class=\"ring-2\" cx=\"130\" cy=\"130\" r=\"80\"><\u002Fcircle>\n      <circle class=\"ring-3\" cx=\"130\" cy=\"130\" r=\"100\"><\u002Fcircle>\n    <\u002Fsvg>\n  <\u002Fdiv>\n\n  <!-- screen -->\n  <div class=\"screen\">\n    <!-- status -->\n    <div class=\"status\">\n      <span class=\"status-time\">9:41<\u002Fspan>\n      <div class=\"status-icons\">\n        <svg width=\"15\" height=\"11\" viewBox=\"0 0 16 12\" fill=\"none\">\n          <rect x=\"0\" y=\"3\" width=\"3\" height=\"9\" rx=\"1\" fill=\"#2A1815\" opacity=\".6\"><\u002Frect>\n          <rect x=\"4.5\" y=\"1.5\" width=\"3\" height=\"10.5\" rx=\"1\" fill=\"#2A1815\" opacity=\".7\"><\u002Frect>\n          <rect x=\"9\" y=\"0\" width=\"3\" height=\"12\" rx=\"1\" fill=\"#2A1815\"><\u002Frect>\n          <rect x=\"13.5\" y=\"0\" width=\"2.5\" height=\"12\" rx=\"1\" fill=\"#2A1815\" opacity=\".25\"><\u002Frect>\n        <\u002Fsvg>\n        <svg width=\"24\" height=\"11\" viewBox=\"0 0 25 12\" fill=\"none\">\n          <rect x=\".5\" y=\".5\" width=\"21\" height=\"11\" rx=\"3.5\" stroke=\"#2A1815\" stroke-opacity=\".3\"><\u002Frect>\n          <rect x=\"2\" y=\"2\" width=\"16\" height=\"8\" rx=\"2\" fill=\"#2A1815\" opacity=\".8\"><\u002Frect>\n          <path d=\"M23 4.5V7.5C23.8 7.2 24.5 6.7 24.5 6C24.5 5.3 23.8 4.8 23 4.5Z\" fill=\"#2A1815\" opacity=\".4\"><\u002Fpath>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- wordmark -->\n    <div class=\"wordmark\">CalmMama<\u002Fdiv>\n\n    <!-- headline -->\n    <div class=\"headline\">\n      <span class=\"hl-small\">Welcome to<\u002Fspan>\n      <span class=\"hl-serif\">CalmMama.<\u002Fspan>\n      <p class=\"subtitle\">A gentle companion for your postpartum journey.<\u002Fp>\n      <div class=\"float-dots\">\n        <div class=\"fdot\"><\u002Fdiv>\n        <div class=\"fdot\"><\u002Fdiv>\n        <div class=\"fdot\"><\u002Fdiv>\n        <div class=\"fdot\"><\u002Fdiv>\n        <div class=\"fdot\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- cta -->\n    <div class=\"cta-area\">\n      <button class=\"btn\" id=\"mainBtn\">\n        <div class=\"btn-content\">\n          Get started\n          <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"M12 5l7 7-7 7\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <div class=\"btn-loading\">\n          <div class=\"spinner\"><\u002Fdiv>\n          Setting up your journey…\n        <\u002Fdiv>\n        <div class=\"btn-done\">\n          <svg class=\"ck\" id=\"ck\" viewBox=\"0 0 24 24\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg>\n          Ready, Mama\n        <\u002Fdiv>\n      <\u002Fbutton>\n      <div class=\"secondary\">Already set up? Continue →<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- transition overlay -->\n  <div class=\"overlay\" id=\"overlay\">\n    <div class=\"overlay-logo\">CalmMama.<\u002Fdiv>\n    <div class=\"overlay-sub\">Preparing your space…<\u002Fdiv>\n    <div class=\"overlay-dot\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\nconst btn     = document.getElementById('mainBtn');\nconst ck      = document.getElementById('ck');\nconst overlay = document.getElementById('overlay');\nlet state = 'idle';\n\nfunction spawnRipple(e) {\n  const rect = btn.getBoundingClientRect();\n  const x = (e.clientX ?? rect.left + rect.width / 2) - rect.left;\n  const y = (e.clientY ?? rect.top  + rect.height / 2) - rect.top;\n  const size = Math.max(rect.width, rect.height) * 1.6;\n  const r = document.createElement('span');\n  r.className = 'ripple';\n  r.style.cssText = `width:${size}px;height:${size}px;left:${x - size/2}px;top:${y - size/2}px`;\n  btn.appendChild(r);\n  setTimeout(() => r.remove(), 680);\n}\n\nbtn.addEventListener('pointerdown', e => {\n  if (state !== 'idle') return;\n  state = 'pressing';\n  btn.classList.add('pressing');\n  btn.setPointerCapture(e.pointerId);\n  spawnRipple(e);\n  try { navigator.vibrate?.(7); } catch(_) {}\n});\n\nbtn.addEventListener('pointerup', () => {\n  if (state !== 'pressing') return;\n  state = 'loading';\n  btn.classList.remove('pressing');\n  btn.classList.add('loading');\n\n  // after load → done state\n  setTimeout(() => {\n    state = 'done';\n    btn.classList.remove('loading');\n    btn.classList.add('done-s');\n    ck.classList.add('draw');\n    try { navigator.vibrate?.([12, 55, 20]); } catch(_) {}\n\n    // transition to next screen\n    setTimeout(() => {\n      overlay.classList.add('show');\n\n      // reset button after a while so you can try again\n      setTimeout(() => {\n        overlay.classList.remove('show');\n        setTimeout(() => {\n          btn.classList.remove('done-s');\n          ck.classList.remove('draw');\n          state = 'idle';\n        }, 380);\n      }, 2800);\n\n    }, 500);\n  }, 1800);\n});\n\nbtn.addEventListener('pointerleave', () => {\n  if (state === 'pressing') {\n    state = 'idle';\n    btn.classList.remove('pressing');\n  }\n});\n\n// subtle parallax on blobs from mouse\ndocument.addEventListener('mousemove', e => {\n  const cx = window.innerWidth / 2;\n  const cy = window.innerHeight / 2;\n  const dx = (e.clientX - cx) / cx;\n  const dy = (e.clientY - cy) / cy;\n  const blobs = document.querySelectorAll('.blob');\n  blobs.forEach((b, i) => {\n    const factor = (i + 1) * 6;\n    b.style.transform = `translate(${dx * factor}px, ${dy * factor}px)`;\n  });\n});\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
