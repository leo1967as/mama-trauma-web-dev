<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check-in Button — Final</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  background: #EDE4DE;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}

/* ── phone shell ── */
.phone {
  width: 340px;
  background: #FBF6F3;
  border-radius: 44px;
  box-shadow:
    0 0 0 9px #2A1815,
    0 0 0 11px #3D2420,
    0 32px 80px rgba(42,24,21,.42),
    0 8px 20px rgba(42,24,21,.2);
  overflow: hidden;
  padding-bottom: 36px;
  position: relative;
}

.island {
  width: 116px; height: 32px;
  background: #2A1815;
  border-radius: 20px;
  margin: 14px auto 0;
}

/* status bar */
.status {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 28px 0;
  height: 44px;
}
.status-time { font-size: 14px; font-weight: 600; color: #2A1815; }
.status-icons { display: flex; gap: 5px; align-items: center; }

/* header zone */
.header-zone {
  padding: 10px 22px 20px;
  background: linear-gradient(160deg, #EDD5CC 0%, #F3E0D8 45%, #FBF6F3 78%);
}
.day-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: rgba(200,112,106,.12);
  border: 1px solid rgba(200,112,106,.25);
  border-radius: 20px;
  padding: 3px 9px;
  font-size: 10px;
  font-weight: 700;
  color: #C8706A;
  letter-spacing: .6px;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.greeting-label { font-size: 12px; color: #96746F; font-weight: 400; margin-bottom: 2px; }
.greeting-name {
  font-family: 'Playfair Display', serif;
  font-size: 32px;
  font-weight: 500;
  font-style: italic;
  color: #2A1815;
  line-height: 1.1;
  letter-spacing: -.3px;
  margin-bottom: 6px;
}
.greeting-name span { color: #C8706A; }
.greeting-sub { font-size: 12.5px; color: #7A5A55; line-height: 1.5; font-weight: 300; max-width: 210px; }

/* card */
.card {
  margin: 0 14px;
  background: #fff;
  border-radius: 22px;
  padding: 18px 18px 18px;
  box-shadow: 0 2px 0 rgba(42,24,21,.06);
}
.checkin-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: #F3E2DC;
  border: 1px solid #EAD8D2;
  border-radius: 20px;
  padding: 4px 10px;
  font-size: 10px;
  font-weight: 700;
  color: #C8706A;
  letter-spacing: .4px;
  margin-bottom: 10px;
}
.card-q {
  font-size: 17px;
  font-weight: 700;
  color: #2A1815;
  line-height: 1.25;
  margin-bottom: 5px;
}
.card-sub {
  font-size: 12px;
  color: #A08580;
  line-height: 1.5;
  font-weight: 300;
  margin-bottom: 18px;
}

/* ══════════════════════════════════════
   THE BUTTON
══════════════════════════════════════ */
.btn-wrap {
  position: relative;
  width: 100%;
}

.btn {
  width: 100%;
  border: none;
  cursor: pointer;
  border-radius: 15px;
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  font-size: 14px;
  font-weight: 700;
  padding: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  color: #fff;
  position: relative;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  letter-spacing: -.1px;

  /* Rich gradient */
  background: linear-gradient(140deg, #A84848 0%, #C8706A 48%, #D4887A 78%, #DDA090 100%);

  /* Layered shadow */
  box-shadow:
    0 12px 30px rgba(168,72,72,.4),
    0 3px 8px  rgba(168,72,72,.2),
    inset 0 1px 0 rgba(255,255,255,.22),
    inset 0 -1px 0 rgba(0,0,0,.1);

  /* transitions */
  transition:
    transform .16s cubic-bezier(.34,1.3,.64,1),
    box-shadow .16s ease;
  will-change: transform, box-shadow;
}

/* top gloss layer */
.btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,.14) 0%, transparent 55%);
  border-radius: 14px;
  pointer-events: none;
  z-index: 0;
}

/* shimmer sweep */
.btn::after {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 55%;
  height: 100%;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(255,255,255,.0) 10%,
    rgba(255,255,255,.26) 50%,
    rgba(255,255,255,.0) 90%,
    transparent 100%
  );
  transform: skewX(-18deg);
  pointer-events: none;
  z-index: 1;
  animation: shimmer-idle 3.6s ease-in-out 2s infinite;
}
@keyframes shimmer-idle {
  0%     { left: -100%; opacity: 1; }
  42%    { left: 130%;  opacity: 1; }
  43%    { opacity: 0; }
  100%   { left: 130%;  opacity: 0; }
}

/* btn label & icon */
.btn-content {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  position: relative;
  z-index: 2;
  transition: opacity .18s ease, transform .18s ease;
}
.ico {
  width: 15px; height: 15px;
  fill: none; stroke: currentColor;
  stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round;
  flex-shrink: 0;
}

/* loading layer */
.btn-loading {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  z-index: 2;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease;
}
.btn-loading-text {
  font-size: 13.5px;
  font-weight: 600;
  color: rgba(255,255,255,.9);
  letter-spacing: -.1px;
}

/* Spinner */
.spinner {
  width: 17px; height: 17px;
  border: 2px solid rgba(255,255,255,.25);
  border-top-color: rgba(255,255,255,.9);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* done layer */
.btn-done {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  z-index: 2;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease;
  font-size: 13.5px;
  font-weight: 600;
  color: #fff;
}
.checkmark {
  width: 18px; height: 18px;
  fill: none; stroke: #fff;
  stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 20;
  stroke-dashoffset: 20;
}
.checkmark.draw {
  animation: draw-check .35s ease forwards .05s;
}
@keyframes draw-check {
  to { stroke-dashoffset: 0; }
}

/* press states */
.btn.pressing {
  transform: scale(0.95) translateY(1.5px) !important;
  box-shadow:
    0 4px 10px rgba(168,72,72,.25),
    0 1px 4px rgba(168,72,72,.15),
    inset 0 1px 0 rgba(255,255,255,.18),
    inset 0 -1px 0 rgba(0,0,0,.1) !important;
  transition: transform .06s ease, box-shadow .06s ease;
}
.btn.loading {
  cursor: default;
  pointer-events: none;
}
.btn.loading .btn-content  { opacity: 0; transform: scale(.88); }
.btn.loading .btn-loading  { opacity: 1; }
.btn.done-state .btn-content { opacity: 0; }
.btn.done-state .btn-loading { opacity: 0; }
.btn.done-state .btn-done   { opacity: 1; }

/* ripple */
.ripple {
  position: absolute;
  border-radius: 50%;
  background: rgba(255,255,255,.3);
  transform: scale(0);
  pointer-events: none;
  animation: ripple-expand .6s ease-out forwards;
  z-index: 3;
}
@keyframes ripple-expand {
  to { transform: scale(4.5); opacity: 0; }
}
</style>
</head>
<body>
<div class="phone">
  <div class="island"></div>

  <!-- status bar -->
  <div class="status">
    <span class="status-time">9:41</span>
    <div class="status-icons">
      <!-- signal -->
      <svg width="15" height="11" viewBox="0 0 16 12" fill="none">
        <rect x="0" y="3" width="3" height="9" rx="1" fill="#2A1815"/>
        <rect x="4.5" y="2" width="3" height="10" rx="1" fill="#2A1815"/>
        <rect x="9" y="0" width="3" height="12" rx="1" fill="#2A1815"/>
        <rect x="13.5" y="0" width="2.5" height="12" rx="1" fill="#2A1815" opacity=".3"/>
      </svg>
      <!-- battery -->
      <svg width="24" height="12" viewBox="0 0 25 12" fill="none">
        <rect x=".5" y=".5" width="21" height="11" rx="3.5" stroke="#2A1815" stroke-opacity=".35"/>
        <rect x="2" y="2" width="16" height="8" rx="2" fill="#2A1815"/>
        <path d="M23 4.5V7.5C23.8 7.2 24.5 6.7 24.5 6C24.5 5.3 23.8 4.8 23 4.5Z" fill="#2A1815" opacity=".4"/>
      </svg>
    </div>
  </div>

  <!-- header -->
  <div class="header-zone">
    <div class="day-badge">Day 7</div>
    <div class="greeting-label">Good morning,</div>
    <div class="greeting-name"><span>Mama</span>.</div>
    <div class="greeting-sub">You're finding your rhythm — one gentle day at a time.</div>
  </div>

  <!-- check-in card -->
  <div class="card">
    <div class="checkin-pill">
      <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Check in now
    </div>
    <div class="card-q">How are you feeling today?</div>
    <div class="card-sub">A quick mood check-in keeps support gentle, early, and easier to understand.</div>

    <div class="btn-wrap">
      <button class="btn" id="mainBtn">
        <!-- shimmer via ::after, gloss via ::before -->

        <!-- idle label -->
        <div class="btn-content">
          <svg class="ico" viewBox="0 0 24 24">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>
          </svg>
          Complete today's check-in
        </div>

        <!-- loading -->
        <div class="btn-loading">
          <div class="spinner"></div>
          <span class="btn-loading-text">Opening check-in…</span>
        </div>

        <!-- done -->
        <div class="btn-done">
          <svg class="checkmark" id="checkSvg" viewBox="0 0 24 24">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          Ready
        </div>
      </button>
    </div>
  </div>
</div>

<script>
const btn = document.getElementById('mainBtn');
const check = document.getElementById('checkSvg');
let state = 'idle'; // idle | pressing | loading | done

/* ── helpers ── */
function spawnRipple(e) {
  const rect = btn.getBoundingClientRect();
  const x = (e.clientX || e.touches?.[0]?.clientX || rect.left + rect.width/2) - rect.left;
  const y = (e.clientY || e.touches?.[0]?.clientY || rect.top  + rect.height/2) - rect.top;
  const size = Math.max(rect.width, rect.height) * 1.6;
  const r = document.createElement('span');
  r.className = 'ripple';
  r.style.cssText = `width:${size}px;height:${size}px;left:${x - size/2}px;top:${y - size/2}px`;
  btn.appendChild(r);
  setTimeout(() => r.remove(), 650);
}

function goLoading() {
  state = 'loading';
  btn.classList.remove('pressing');
  btn.classList.add('loading');

  setTimeout(() => {
    state = 'done';
    btn.classList.remove('loading');
    btn.classList.add('done-state');
    check.classList.add('draw');
    try { navigator.vibrate?.([12, 60, 20]); } catch(er) {}

    setTimeout(() => {
      btn.classList.remove('done-state');
      check.classList.remove('draw');
      state = 'idle';
      btn.style.transform = '';
    }, 2200);
  }, 1600);
}

/* ── pointer events ── */
btn.addEventListener('pointerdown', e => {
  if (state !== 'idle') return;
  state = 'pressing';
  btn.classList.add('pressing');
  btn.setPointerCapture(e.pointerId);
  spawnRipple(e);
  try { navigator.vibrate?.(7); } catch(er) {}
});

btn.addEventListener('pointerup', e => {
  if (state !== 'pressing') return;
  goLoading();
});

btn.addEventListener('pointerleave', () => {
  if (state === 'pressing') {
    state = 'idle';
    btn.classList.remove('pressing');
  }
});
</script>
</body>
</html>
